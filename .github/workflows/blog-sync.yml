name: Blog Sync

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:  # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Blog Sync
        run: |
          # Replace 'your-domain.vercel.app' with your actual Vercel deployment domain
          # Ensure CRON_SECRET is set as a GitHub Repository Secret
          curl -X GET "https://your-domain.vercel.app/api/blog/sync" \
            -H "User-Agent: GitHub-Actions" \
            -H "x-vercel-cron-auth: ${{ secrets.CRON_SECRET }}"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
